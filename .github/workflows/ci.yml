name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PALEO_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q

      - name: Parse the fixture page
        run: |
          uv run python scripts/seed_fixture_data.py
          uv run paleo parse wikipedia --year 2026

      - name: dbt build
        working-directory: dbt
        run: uv run dbt build --profiles-dir .
