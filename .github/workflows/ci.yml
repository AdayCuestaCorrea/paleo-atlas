name: CI

on:
  push:
    branches-ignore: [data] # the data branch holds no code
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PALEO_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q

      - name: Parse the fixture page
        run: |
          uv run python scripts/seed_fixture_data.py
          uv run paleo parse wikipedia --year 2026

      - name: dbt build
        working-directory: dbt
        # as_of pins "today" so date-based tests do not drift on fixture data.
        run: |
          uv run dbt build --profiles-dir . --vars '{as_of: "2026-11-02"}'

      - name: Build and check the website
        run: |
          uv run paleo site --base /paleo-atlas
          uv run paleo site --check --base /paleo-atlas

      - name: Fingerprint
        # What this job produced (warehouse tables and site files), for the parity
        # check with the paleo_ci_parity DAG of Airflow (scripts/parity.py).
        run: uv run python scripts/fingerprint.py --output fingerprint.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: fingerprint
          path: fingerprint.json

  dags:
    # The Airflow DAGs load without import errors or cycles (Airflow 3.3, ALCANCE A8).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install Airflow
        run: |
          uv venv --python 3.14 .airflow-venv
          uv pip install --python .airflow-venv "apache-airflow==3.3.2" pytest \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.14.txt

      - name: Load the DAGs
        run: .airflow-venv/bin/python -m pytest -q airflow/tests
