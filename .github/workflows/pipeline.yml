name: Pipeline

# Daily refresh (ALCANCE.md §15): ingest the sources, write the pending texts,
# rebuild the warehouse and the website, and publish it on GitHub Pages.
# Raw data and derived texts are committed to the `data` branch; the cache
# (abstracts, private quotes, LLM cache) and the DuckDB file never are.

on:
  schedule:
    # Off the top of the hour, when GitHub delays or drops scheduled runs. The
    # second one is a backup: it does nothing if a run already finished today.
    # (Edited on 2026-11-04 so GitHub registers the schedule again: no scheduled
    # run had ever started since the repository was created.)
    - cron: "23 6 * * *" # main run (A6)
    - cron: "47 10 * * *" # backup
  workflow_dispatch:
    inputs:
      narrative:
        description: Write texts for pending species with Groq
        type: boolean
        default: true

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # commit to the data branch
      actions: read # step durations for the run report
    env:
      PALEO_DATA_DIR: ${{ github.workspace }}/data
      PALEO_SITE_BASE: /paleo-atlas
    outputs:
      site: ${{ steps.site.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out the data branch
        uses: actions/checkout@v7.0.1
        with:
          ref: data
          path: data

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Anything new?
        # Every run leaves a record in data/runs (paleo report), also when nothing
        # changed: the freshness test and the site footer read it. Ingest and texts
        # only run by hand, on Mondays (weekly recap) or when the Wikipedia list changed.
        run: |
          if [ "${{ github.event.schedule }}" = "47 10 * * *" ] && uv run paleo report ran-today; then
            echo "The main run already finished today."
            echo "SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi
          case "${{ github.event_name }}/${{ github.event.schedule }}" in
            workflow_dispatch/*) trigger=manual ;;
            "schedule/47 10 * * *") trigger=backup ;;
            *) trigger=schedule ;;
          esac
          # paleo check: 0 changed, 1 nothing new, 2 the check failed (then run everything).
          code=0
          if [ "$trigger" != manual ] && [ "$(date -u +%u)" != 1 ]; then
            uv run paleo check || code=$?
          fi
          if [ "$code" != 1 ]; then
            echo "RUN=true" >> "$GITHUB_ENV"
            uv run paleo report start --trigger "$trigger" --changed
          else
            echo "Nothing changed: only the run log, the warehouse and the site are refreshed."
            uv run paleo report start --trigger "$trigger" --no-changed
          fi

      - name: Ingest and parse
        if: env.RUN == 'true'
        run: |
          uv run paleo ingest wikipedia
          uv run paleo parse wikipedia
          uv run paleo ingest pbdb
          uv run paleo ingest studies
          uv run paleo ingest images
          uv run paleo ingest articles
          uv run paleo ingest news

      - name: Facts and texts for pending species (Groq)
        if: env.RUN == 'true' && (github.event_name == 'schedule' || inputs.narrative)
        # Up-to-date species are skipped. If the free quota runs out or Groq
        # fails, the rest keep their fallback text and are retried tomorrow.
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          uv run paleo news classify --provider groq
          uv run paleo news dedup --provider groq
          uv run paleo facts --provider groq
          uv run paleo write --provider groq
          uv run paleo titles --provider groq

      - name: dbt build
        if: env.SKIP != 'true'
        # interim/ is never committed: rebuild it from the stored revisions (no network).
        run: |
          [ "$RUN" = true ] || uv run paleo parse wikipedia
          uv run paleo build

      - name: Build the website
        id: site
        if: env.SKIP != 'true'
        run: |
          uv run paleo site
          uv run paleo site --check

      - name: Run report
        if: always() && env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            > "$RUNNER_TEMP/jobs.json" || echo '{}' > "$RUNNER_TEMP/jobs.json"
          uv run paleo report finish --jobs "$RUNNER_TEMP/jobs.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit to the data branch
        # Always, so new raw data and the run log are kept even if dbt or the site fail.
        if: always() && env.SKIP != 'true'
        working-directory: data
        run: |
          git add -A
          if git diff --cached --name-only | grep -E '^(cache|interim)/|\.duckdb'; then
            echo "::error::private or local files staged; refusing to commit"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          message="Data update $(date -u +%F)"
          if [ -z "$(git diff --cached --name-only | grep -v '^runs/')" ]; then
            message="Run log $(date -u +%F)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "$message"
          git pull -q --rebase origin data
          git push -q origin HEAD:data

      - uses: actions/upload-pages-artifact@v5.0.0
        if: always() && steps.site.outcome == 'success'
        with:
          path: site/_build

  deploy:
    needs: update
    if: needs.update.outputs.site == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
