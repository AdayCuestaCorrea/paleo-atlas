name: paleo_atlas
version: "0.1.0"
config-version: 2
profile: paleo_atlas

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

vars:
  pbdb_lag_weeks: 8  # A7: weeks a new taxon may be missing from PBDB before failing

models:
  paleo_atlas:
    staging:
      # Tables, not views: staging reads files with paths relative to dbt/, so
      # views would break when the warehouse is queried from anywhere else.
      +materialized: table
    intermediate:
      +materialized: view
    marts:
      +materialized: table
