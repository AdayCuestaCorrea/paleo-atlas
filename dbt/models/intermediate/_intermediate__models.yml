version: 2

models:
  - name: int_catalog_genera
    description: >
      Encyclopedia genera (Phase 3): every accepted extinct genus of the enabled clades of
      the scope seed, in its most specific clade, with its accepted species (no junior synonyms).
    columns:
      - name: taxon_key
        data_tests: [unique, not_null]
      - name: taxonomic_block
        data_tests: [not_null]
      - name: taxon_group
        data_tests: [not_null]
  - name: int_genus_occurrences
    description: Countries and coordinate range of each genus from PBDB occurrences.
    columns:
      - name: genus_name
        data_tests: [unique, not_null]
  - name: int_genus_wikipedia
    description: >
      Verified Wikipedia articles of the encyclopedia genera: the Wikidata item must
      carry the PBDB id (P842) of the genus or of one of its species and descend
      from the block root (P171).
    columns:
      - name: genus_name
        data_tests: [unique, not_null]
      - name: en_title
        data_tests: [not_null]
  - name: int_taxon_pages
    columns:
      - name: taxon_key
        data_tests: [unique, not_null]
      - name: page_type
        data_tests:
          - accepted_values:
              arguments:
                values: [new, genus, known]
  - name: int_research_taxon_links
    description: Study ↔ taxon links (wikilinks and italic names resolved in PBDB or new taxa).
  - name: int_study_reliability
    columns:
      - name: study_id
        data_tests: [unique, not_null]
      - name: reliability_status
        description: Every study gets one status, so every study shows at least one signal.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [retracted, preprint, peer_reviewed, unverified]
  - name: int_image_best_per_taxon
    columns:
      - name: taxon_key
        data_tests: [unique, not_null]
      - name: license_allowed
        data_tests:
          - accepted_values:
              arguments:
                values: [true]
  - name: int_new_taxa_history
    columns:
      - name: valid_from
        data_tests: [not_null]
  - name: int_taxon_events
    columns:
      - name: event_id
        data_tests: [unique, not_null]
  - name: int_opinion_events
    description: >
      History events from PBDB's taxonomic opinions: the first opinion that gives a
      name each new status, plus revalidations by PBDB's current classification.

unit_tests:
  - name: new_taxa_history_starts_a_version_only_when_a_field_changes
    description: >
      Three revisions: the status changes in the second and nothing changes in the
      third, so there must be two versions and the first must end where the second starts.
    model: int_new_taxa_history
    given:
      - input: ref('stg_wikipedia__new_taxa_revisions')
        rows:
          - {new_taxon_id: "p | Antusuchus", taxon_name: Antusuchus, revid: 1, revision_timestamp: "2026-10-01 10:00:00+00", novelty: new_genus_and_species, status: in_press, name_authors: A, age_text: Albian, type_locality: X, countries: "['Argentina']", notes_text: n, primary_doi: "10.1/x"}
          - {new_taxon_id: "p | Antusuchus", taxon_name: Antusuchus, revid: 2, revision_timestamp: "2026-10-15 10:00:00+00", novelty: new_genus_and_species, status: valid, name_authors: A, age_text: Albian, type_locality: X, countries: "['Argentina']", notes_text: n, primary_doi: "10.1/x"}
          - {new_taxon_id: "p | Antusuchus", taxon_name: Antusuchus, revid: 3, revision_timestamp: "2026-11-01 10:00:00+00", novelty: new_genus_and_species, status: valid, name_authors: A, age_text: Albian, type_locality: X, countries: "['Argentina']", notes_text: n, primary_doi: "10.1/x"}
    expect:
      rows:
        - {revid: 1, status: in_press, version_number: 1, valid_from: "2026-10-01 10:00:00+00", valid_to: "2026-10-15 10:00:00+00", is_current: false, changed_fields: "[]"}
        - {revid: 2, status: valid, version_number: 2, valid_from: "2026-10-15 10:00:00+00", valid_to: null, is_current: true, changed_fields: "['status']"}
  - name: catalog_genera_take_the_most_specific_clade_in_scope
    description: >
      A bird genus is listed under Avialae, Dinosauria and Archosauria: its page is in
      the birds group (lowest priority). A genus of a disabled clade gets no page, and
      species are listed under their genus.
    model: int_catalog_genera
    given:
      - input: ref('scope_clades')
        rows:
          - {block: archosaurs, taxon_group: birds, pbdb_base_name: Avialae, priority: 1, enabled: true}
          - {block: archosaurs, taxon_group: non_avian_dinosaurs, pbdb_base_name: Dinosauria, priority: 2, enabled: true}
          - {block: archosaurs, taxon_group: other_archosaurs, pbdb_base_name: Archosauria, priority: 9, enabled: true}
          - {block: fossil_fishes, taxon_group: placoderms, pbdb_base_name: Placodermi, priority: 1, enabled: false}
      - input: ref('stg_pbdb__catalog')
        rows:
          - {base_name: Archosauria, pbdb_taxon_no: "1", pbdb_name: Archaeopteryx, taxon_rank: genus, version_date: "2026-11-01"}
          - {base_name: Dinosauria, pbdb_taxon_no: "1", pbdb_name: Archaeopteryx, taxon_rank: genus, version_date: "2026-11-01"}
          - {base_name: Avialae, pbdb_taxon_no: "1", pbdb_name: Archaeopteryx, taxon_rank: genus, version_date: "2026-11-01"}
          - {base_name: Avialae, pbdb_taxon_no: "2", pbdb_name: Archaeopteryx lithographica, taxon_rank: species, genus_name: Archaeopteryx, version_date: "2026-11-01"}
          - {base_name: Dinosauria, pbdb_taxon_no: "3", pbdb_name: Spinosaurus, taxon_rank: genus, version_date: "2026-11-01"}
          - {base_name: Placodermi, pbdb_taxon_no: "4", pbdb_name: Dunkleosteus, taxon_rank: genus, version_date: "2026-11-01"}
    expect:
      rows:
        - {taxon_key: archaeopteryx, taxon_group: birds, species_count: 1}
        - {taxon_key: spinosaurus, taxon_group: non_avian_dinosaurs, species_count: 0}
  - name: genus_articles_need_the_pbdb_id_and_the_right_branch_of_the_tree
    description: >
      The moth Coloradia's Wikidata item carries the dinosaur's PBDB id by mistake but
      does not descend from Archosauria: rejected. An article whose item carries the id
      of one of the genus' species is accepted. Disambiguation pages never are.
    model: int_genus_wikipedia
    given:
      - input: ref('stg_wikipedia__genus_articles')
        rows:
          - {genus_name: Coloradia, en_title: Coloradia, disambiguation: false, pbdb_ids: "['38639']", in_scope_tree: false, version_date: "2026-11-02"}
          - {genus_name: Fregilupus, en_title: Hoopoe starling, disambiguation: false, pbdb_ids: "['371453']", in_scope_tree: true, version_date: "2026-11-02"}
          - {genus_name: Rex, en_title: Rex, disambiguation: true, pbdb_ids: "['9']", in_scope_tree: true, version_date: "2026-11-02"}
      - input: ref('stg_pbdb__catalog')
        rows:
          - {pbdb_name: Coloradia, pbdb_taxon_no: "38639", taxon_rank: genus}
          - {pbdb_name: Fregilupus, pbdb_taxon_no: "371451", taxon_rank: genus}
          - {pbdb_name: Fregilupus varius, genus_name: Fregilupus, pbdb_taxon_no: "371453", taxon_rank: species}
          - {pbdb_name: Rex, pbdb_taxon_no: "9", taxon_rank: genus}
    expect:
      rows:
        - {genus_name: Fregilupus, en_title: Hoopoe starling}
  - name: opinions_give_one_event_per_new_status_and_a_revalidation
    description: >
      Brontosaurus: described in 1879, a synonym of Apatosaurus from 1903 (repeated in
      1936), valid for Romer in 1966 and accepted again by PBDB's current classification
      in 2015. Repeated opinions and plain "belongs to" give no event.
    model: int_opinion_events
    given:
      - input: ref('stg_pbdb__opinions')
        rows:
          - {opinion_id: "opn:1", pbdb_taxon_no: "txn:1", taxon_name: Brontosaurus, taxon_rank: genus, status: belongs to, parent_name: Apatosaurinae, spelling_reason: original spelling, opinion_author: Marsh, opinion_year: 1879, reference_id: "ref:1", is_current_classification: false}
          - {opinion_id: "opn:2", pbdb_taxon_no: "txn:1", taxon_name: Brontosaurus, taxon_rank: genus, status: subjective synonym of, parent_name: Apatosaurus, spelling_reason: original spelling, opinion_author: Riggs, opinion_year: 1903, reference_id: "ref:2", is_current_classification: false}
          - {opinion_id: "opn:3", pbdb_taxon_no: "txn:1", taxon_name: Brontosaurus, taxon_rank: genus, status: subjective synonym of, parent_name: Apatosaurus, spelling_reason: original spelling, opinion_author: Gilmore, opinion_year: 1936, reference_id: "ref:3", is_current_classification: false}
          - {opinion_id: "opn:4", pbdb_taxon_no: "txn:1", taxon_name: Brontosaurus, taxon_rank: genus, status: belongs to, parent_name: Titanosauridae, spelling_reason: original spelling, opinion_author: Romer, opinion_year: 1966, reference_id: "ref:4", is_current_classification: false}
          - {opinion_id: "opn:5", pbdb_taxon_no: "txn:1", taxon_name: Brontosaurus, taxon_rank: genus, status: belongs to, parent_name: Apatosaurinae, spelling_reason: original spelling, opinion_author: Tschopp et al., opinion_year: 2015, reference_id: "ref:5", is_current_classification: true}
      - input: ref('stg_pbdb__refs')
        rows:
          - {reference_id: "ref:2", title: Structure of Apatosaurus, journal: Field Columbian Museum, doi: null}
          - {reference_id: "ref:5", title: Revision of Diplodocidae, journal: PeerJ, doi: 10.7717/peerj.857}
    expect:
      rows:
        - {event_type: description, opinion_year: 1879, related_name: null, study_id: "pbdb:ref:1", reference_journal: null}
        - {event_type: synonymized, opinion_year: 1903, related_name: Apatosaurus, study_id: "pbdb:ref:2", reference_journal: Field Columbian Museum}
        - {event_type: revalidated, opinion_year: 2015, related_name: null, study_id: "doi:10.7717/peerj.857", reference_journal: PeerJ}
