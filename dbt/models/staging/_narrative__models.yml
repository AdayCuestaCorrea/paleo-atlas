version: 2

models:
  - name: stg_narrative__facts
    columns:
      - name: fact_key
        data_tests: [unique, not_null]
      - name: taxon_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_taxon')
                field: taxon_key
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [description, curiosities, discovery, paleobiology, classification, time_and_habitat, debate]
  - name: stg_narrative__fact_counts
    columns:
      - name: taxon_key
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_taxon')
                field: taxon_key
  - name: stg_news__labels
    columns:
      - name: news_key
        data_tests: [unique, not_null]
  - name: stg_news__groups
    columns:
      - name: news_key
        data_tests: [unique, not_null]
      - name: story_key
        data_tests: [not_null]
  - name: stg_narrative__study_titles
    columns:
      - name: doi
        data_tests: [unique, not_null]
      - name: title_es
        data_tests: [not_null]
  - name: stg_narrative__citations
    columns:
      - name: citation_key
        data_tests: [unique, not_null]
  - name: stg_narrative__texts
    columns:
      - name: text_key
        data_tests: [unique, not_null]
      - name: taxon_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_taxon')
                field: taxon_key
      - name: lang
        data_tests:
          - accepted_values:
              arguments:
                values: [en, es]
