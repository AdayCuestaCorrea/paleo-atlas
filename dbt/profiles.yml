# Paths come from the environment so local runs, CI and Airflow share one profile.
# PALEO_DATA_DIR defaults to ../data (the repository's data/ folder).
paleo_atlas:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('PALEO_DATA_DIR', '../data') }}/warehouse.duckdb"
      threads: 4
