version: 2

seeds:
  - name: license_allowlist
    description: >
      Image licenses (normalized ids). Only `allowed = true` licenses can be shown
      (ALCANCE.md §19): no non-commercial (NC) or no-derivatives (ND) licenses.
    columns:
      - name: license_id
        data_tests: [unique, not_null]
  - name: group_clades
    description: >
      Last-resort image for a taxon page: the PhyloPic silhouette of the clade that
      stands for its group (ALCANCE.md §11.1, "o la del grupo").
    columns:
      - name: taxon_group
        data_tests: [unique, not_null]
  - name: scope_clades
    description: >
      Taxonomic scope of ALCANCE.md §4 as data: every PBDB clade whose extinct genera
      get an encyclopedia page, with its block and Wikipedia group. A group may need
      several clades: PBDB keeps Aves (Confuciusornis…) and Avialae (Archaeopteryx,
      Hesperornis…) apart, so birds take both. When a genus is in several clades (a
      bird is also a dinosaur and an archosaur), the lowest `priority` wins. Blocks
      are switched on by phase with `enabled`; the row order is the order of the
      groups on the site. `block_root` marks the clade that
      contains the whole block: its occurrences are downloaded once for the block,
      and a Wikipedia article of a genus is only trusted when its Wikidata item
      descends from the root's `wikidata_item` (P171). `pbdb_query` replaces the
      clade in the PBDB requests: `seed:featured_fishes` asks for the genera listed in
      that seed (famous fishes outside Placodermi and Chondrichthyes).
      Read by `paleo ingest pbdb` too (src/paleo/ingest/pbdb.py), so the scope
      lives in one place.
    columns:
      - name: pbdb_base_name
        data_tests: [unique, not_null]
      - name: block
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [archosaurs, marine_reptiles, fossil_fishes]
  - name: featured_fishes
    description: >
      Hand-picked famous extinct fishes outside Placodermi and Chondrichthyes
      (decision of 2026-11-02), with the reason each one is in. Spelled as in PBDB
      (Eustenopteron). Edit freely: one row per genus.
    columns:
      - name: genus
        data_tests: [unique, not_null]
  - name: countries
    description: >
      PBDB country codes (data1.2/config?show=countries) with English and Spanish
      names. PBDB uses UK for the United Kingdom and O1–O7 for oceans. Read by the
      site too (paleo.site.terms.place).
    columns:
      - name: country_code
        data_tests: [unique, not_null]
      - name: name_es
        data_tests: [not_null]
  - name: trusted_journals
    description: >
      Initial hand-curated list of established journals (decision A16). A
      secondary reliability signal only; it never hides a study.
    columns:
      - name: journal
        data_tests: [unique, not_null]

  - name: news_feeds
    description: >
      The news feeds read by paleo ingest news (F9, ALCANCE.md §5): only outlets whose
      terms allow reusing headlines and links; the summary is kept only where allowed.
    columns:
      - name: feed
        data_tests: [unique, not_null]
      - name: lang
        data_tests:
          - accepted_values:
              arguments:
                values: ['es', 'en']
  - name: glossary_terms
    description: >
      Technical terms of the verified pages (paleo glossary terms, §12.2): English and
      Spanish term, their forms, category and how many pages use them.
    config:
      column_types: {forms_en: varchar, forms_es: varchar, source_en: varchar}
    columns:
      - name: term_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - accepted_values:
              arguments:
                values: [anatomy, time, classification, animals, rocks]
  - name: source_cadence
    description: >
      How often each source is checked (ALCANCE.md §5), and its names in both
      languages, for the data status page. The rhythm is data, not code.
    columns:
      - name: source
        data_tests: [unique, not_null]
      - name: every_days
        data_tests: [not_null]
