gl_lead = "The technical terms of the pages, explained in one sentence, with their source."
gl_intro = "{n} terms used in the pages, explained in one sentence. Each definition is written from the term’s Wikipedia article, which is cited, and published only if it passes automatic checks: no sentence copied from the source, no number that is not in it, and another model confirms it says the same as the source. In a sample of 20 reviewed by hand, all those that could be judged were right. In the pages, a term is marked the first time it appears: hover or tap it to see its definition."
