news_intro = "Noticias de paleontología de medios cuya licencia o condiciones permiten enlazarlas: ScienceDaily, The Conversation (CC BY-ND 4.0) y la agencia SINC (CC BY 4.0). Cada día se recogen sus titulares; un modelo de lenguaje descarta lo que no trata de los grupos del atlas, clasifica el resto y agrupa los artículos que cuentan la misma historia, también entre idiomas. El titular y el resumen son los del medio, sin modificar. Comparado con una persona en una muestra a ciegas, el modelo acierta el tipo en el 74 % de los titulares."
