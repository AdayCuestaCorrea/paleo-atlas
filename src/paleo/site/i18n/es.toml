gl_lead = "Los términos técnicos de las fichas, explicados en una frase, con su fuente."
gl_intro = "{n} términos que aparecen en las fichas, explicados en una frase. Cada definición se redacta a partir del artículo de Wikipedia del término, que se cita, y solo se publica si pasa las comprobaciones automáticas: no copia frases de la fuente, no añade cifras que no estén en ella y otro modelo confirma que dice lo mismo que la fuente. En una muestra de 20 revisada a mano, 19 eran correctas (95 %) y la otra no se pudo juzgar. En las fichas, el término aparece marcado la primera vez: pasa el ratón o tócalo para ver su definición."
